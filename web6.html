<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
  
<script> 
  //JSON = Javascript object notation
  //Sirve como interfaz de comunicación entre sistemas heterogeneos

  //Objeto JAVASCRIPT
  const fichaPersonal = {
    apellidos: "Quintana Meneses",
    nombres: "Nayeli Lucero",
    telefonos: ["936062111", "933740238"],
    locacion : {
      departamento: "ICA",
      provincia:"Chincha",
      distrito:"Chincha",
      direccion:"Psj los jazmines 110",
      referencia: null
    }
  }

  // Crear JSON(cadena simple) - Es un string que recibimos de otro servidor
  const jsonBasico = `{"carrera": "Ingenieria de software", "ciclo": "IV", "curso":"Seminario"}`
  //Convertir OBJECT > JSON (cadena de caracteres)
  console.log(JSON.stringify(fichaPersonal))

  //Mostrar el jsonBasico
  console.log(jsonBasico)

  //JSON > OBJECT
  console.log(JSON.parse(jsonBasico))

</script>


</body>
</html>
