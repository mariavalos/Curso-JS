  <script>
    async function obtenerDatos() {
      const API_URL = `https://api.restcountries.com/countries/v5?q=canada`

      try{
        const respuesta = await fetch(API_URL,{
          headers: { 'Authorization': 'Bearer rc_live_bb7ce247709a4f8f9425dd9d1e2b8994' }
        })

        if(!respuesta.ok){
          throw new Error(`no es posible conectarse al servidor `)
        }

        const datos = await respuesta.json();
        console.log(datos);
      }catch(e){
        console.error(`no se pudo concretar la operacion: ${e}`)
      }
      
    }
  </script>
