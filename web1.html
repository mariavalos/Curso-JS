<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button type="button" id="mensaje">Mensaje</button>
  <input type="text" id="caja">

  <script>
    //Propiedad: caracteristicas objetos (nombre. ubicacion ,color)
    //Metodo : acciones (verbo infinitivos)
    //Evento : respuesta(clic,arrastrar)
    
    //E1: al cargar la pagina...
    //DOM : contenido de la pgina | documento object model
    document.addEventListener("DOMContentLoaded", function(){
      console.log("DOM fue cargado completamente...")
    
      const boton= document.getElementById("mensaje")
      //E" : clic (pulsar el boton)
      boton.addEventListener("click", function(){
        console.log("Hola mundo desde JS")
      })
      //¿que significa addEventListener
      //agregar evento de escucha/atencion
      //E3: evento enter...
      const contenido = document.getElementById("caja")
      contenido.addEventListener("focus", function(){
        console.log("Elemento activo la caja")
      })
    })
  </script>

</body>
</html>
